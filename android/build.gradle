// The Android Gradle Plugin builds the library with the Android NDK, from the
// CMake build shared with the other platforms (../src/CMakeLists.txt). No NDK
// is named here, so AGP's default applies, as for the other plugins the apps
// build.

group = "org.magicgrants.fhse_native"
version = "1.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.1.0")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

android {
    if (project.android.hasProperty("namespace")) {
        namespace = "org.magicgrants.fhse_native"
    }

    compileSdk = 36

    externalNativeBuild {
        cmake {
            path = "../src/CMakeLists.txt"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk = 21
    }
}
