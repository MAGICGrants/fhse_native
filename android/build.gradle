// The Android Gradle Plugin builds the library with the Android NDK, from the
// CMake build shared with the other platforms (../src/CMakeLists.txt).

group = "org.magicgrants.fhse_native"
version = "1.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.1.0")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

android {
    if (project.android.hasProperty("namespace")) {
        namespace = "org.magicgrants.fhse_native"
    }

    compileSdk = 36

    // The NDK the app pins (its android/app/build.gradle) rather than AGP's
    // default, so release and F-Droid builds compile this library with the NDK
    // they install. Flutter's root android/build.gradle evaluates :app before
    // the plugins; without an app (or an NDK it names), AGP's default applies.
    def appNdk = rootProject.findProject(":app")?.extensions?.findByName("android")?.ndkVersion
    if (appNdk) {
        ndkVersion = appNdk
    }

    externalNativeBuild {
        cmake {
            path = "../src/CMakeLists.txt"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk = 21
    }
}
